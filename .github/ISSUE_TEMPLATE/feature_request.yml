name: Feature request
description: Propose a daemon8 behavior or capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use Discussions for questions or open-ended design threads.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should daemon8 support that it does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected behavior, command, config, or API shape.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "CLI / service"
        - "MCP tools"
        - "Browser / CDP"
        - "ADB / device logs"
        - "Config / init / connect"
        - "Logs / sources / parsers"
        - "Store / runtime state"
        - "Docs / repo metadata"
        - "Cross-cutting"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or alternate designs.
    validations:
      required: false

  - type: textarea
    id: contribution
    attributes:
      label: Contribution intent
      description: State whether you plan to open a PR.
      placeholder: "Yes / No / Maybe"
    validations:
      required: false
