name: Feature request
description: A proposal for something Daemon8 should do (and doesn't).
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests get triaged on merit — impact, scope, fit with the OSS direction. "Could you add a paid feature" is a non-starter; Daemon8 ships without a paid tier per policy.

        For questions or design debate, use [Discussions](https://github.com/daemon8ai/daemon8/discussions) instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the current code doesn't support?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Rough shape of the feature. API surface, behavior, config, anything relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other designs, or reasons existing tools don't fit.
    validations:
      required: false

  - type: dropdown
    id: subtree
    attributes:
      label: Affected subtree
      options:
        - "daemon/ (Rust daemon + crates)"
        - "sdks/php/"
        - "sdks/php-laravel/"
        - "sdks/php-symfony/"
        - "Cross-cutting (multiple subtrees)"
    validations:
      required: true

  - type: textarea
    id: willing
    attributes:
      label: Willing to contribute?
      description: If you'd send a PR, great — per CONTRIBUTING, align on scope via issue first.
      placeholder: "Yes / No / Maybe with guidance"
    validations:
      required: false
