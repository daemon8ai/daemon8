name: Bug report
description: Report reproducible behavior that is broken or incorrect.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues must be reported privately. See [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to trigger the behavior.
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include errors, logs, or stack traces when relevant.
    validations:
      required: true

  - type: input
    id: daemon-version
    attributes:
      label: daemon8 version
      description: Output of `daemon8 --version`
      placeholder: "daemon8 0.5.0-alpha.3"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "CLI / service"
        - "MCP tools"
        - "Browser / CDP"
        - "ADB / device logs"
        - "Config / init / connect"
        - "Logs / sources / parsers"
        - "Store / runtime state"
        - "Docs / repo metadata"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "macOS 15 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: Required only for Browser / CDP issues.
      placeholder: "Chrome 130.0.6723.116"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste daemon logs, command output, or console traces. Redact secrets.
      render: shell
    validations:
      required: false
