name: Bug report
description: Something that used to work, or should work, is broken.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A reproducible bug report with environment details gets triaged fastest.

        **Security issues:** do not open a public issue. See [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what's broken.
      placeholder: "daemon8 cli-hook crashes on Bun stdin because..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimum sequence to trigger it.
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behavior you thought would happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Error text, logs, stack traces. Use ``` fences for anything multi-line.
    validations:
      required: true

  - type: input
    id: daemon-version
    attributes:
      label: Daemon8 version
      description: Output of `daemon8 --version`
      placeholder: "daemon8 1.0.0 (commit abc1234)"
    validations:
      required: true

  - type: dropdown
    id: subtree
    attributes:
      label: Affected subtree
      options:
        - "daemon/ (Rust daemon + crates)"
        - "sdks/php/"
        - "sdks/php-laravel/"
        - "sdks/php-symfony/"
        - "app/ (marketing site)"
        - "backend/ (API)"
        - "Docs / meta"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "macOS 14.5 / Ubuntu 24.04 / Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version (for browser-observation bugs only)
      placeholder: "Chrome 130.0.6723.116"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste output from `daemon8 logs -f`, daemon stderr, or the console trace. Redact any secrets.
      render: shell
    validations:
      required: false
