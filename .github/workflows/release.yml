name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to build (e.g. v1.0.1)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: daemon8

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            smoke: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
            smoke: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            smoke: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Release preflight
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RELEASE_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: bash scripts/release-check.sh

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p daemon8

      - name: Strip binary (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
          else
            strip target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
          fi

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }} LICENSE

      - name: Smoke packaged artifact (unix)
        if: matrix.smoke && matrix.archive == 'tar.gz'
        run: |
          mkdir -p smoke
          tar xzf ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz -C smoke
          smoke/${{ env.BINARY_NAME }} --version
          smoke/${{ env.BINARY_NAME }} --help
          SMOKE_ROOT="$RUNNER_TEMP/daemon8-smoke"
          mkdir -p "$SMOKE_ROOT"
          cat > "$SMOKE_ROOT/config.toml" <<EOF
          [server]
          port = 18888

          [storage]
          path = "$SMOKE_ROOT/store"
          screenshot_path = "$SMOKE_ROOT/screens"

          [adb]
          enabled = false
          EOF
          smoke/${{ env.BINARY_NAME }} --config "$SMOKE_ROOT/config.toml" status --json
          smoke/${{ env.BINARY_NAME }} --config "$SMOKE_ROOT/config.toml" serve --port 18888 &
          DAEMON8_PID=$!
          trap 'kill "$DAEMON8_PID" 2>/dev/null || true; wait "$DAEMON8_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18888/health >/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          echo "daemon8 health smoke failed" >&2
          exit 1

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Copy-Item LICENSE target\${{ matrix.target }}\release\
          Compress-Archive `
            -Path target\${{ matrix.target }}\release\daemon8.exe, `
                   target\${{ matrix.target }}\release\LICENSE `
            -DestinationPath ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip

      - name: Smoke packaged artifact (windows)
        if: matrix.smoke && matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Expand-Archive -Path "${{ env.BINARY_NAME }}-${{ matrix.target }}.zip" -DestinationPath smoke -Force
          .\smoke\daemon8.exe --version
          .\smoke\daemon8.exe --help
          $SmokeRoot = Join-Path $env:RUNNER_TEMP "daemon8-smoke"
          New-Item -ItemType Directory -Force -Path $SmokeRoot | Out-Null
          $ConfigPath = Join-Path $SmokeRoot "config.toml"
          $StorePath = (Join-Path $SmokeRoot "store").Replace('\', '\\')
          $ScreensPath = (Join-Path $SmokeRoot "screens").Replace('\', '\\')
          @"
          [storage]
          path = "$StorePath"
          screenshot_path = "$ScreensPath"

          [adb]
          enabled = false
          "@ | Set-Content -Path $ConfigPath -NoNewline
          .\smoke\daemon8.exe --config $ConfigPath status --json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.*

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        startsWith(github.event.inputs.ref, 'v') ||
        startsWith(github.event.inputs.ref, 'refs/tags/v')
      )
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          tag="${RELEASE_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create MCP registry alias artifact
        run: cp artifacts/daemon8-aarch64-apple-darwin.tar.gz artifacts/daemon8-mcp-server-aarch64-apple-darwin.tar.gz

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true

      - name: Upload to server
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          VERSION="${{ steps.release-tag.outputs.tag }}"
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH/$VERSION"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key artifacts/* "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/$VERSION/"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "ln -sfn $DEPLOY_PATH/$VERSION $DEPLOY_PATH/latest"
