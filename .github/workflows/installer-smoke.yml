name: Installer Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/installer-artifact-smoke.sh
      - scripts/installer-artifact-smoke.ps1
      - .github/workflows/installer-smoke.yml
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/installer-artifact-smoke.sh
      - scripts/installer-artifact-smoke.ps1
      - .github/workflows/installer-smoke.yml

jobs:
  unix:
    name: Unix installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
      - name: Run installer against current artifact
        run: bash scripts/installer-artifact-smoke.sh

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run installer against current artifact
        shell: pwsh
        run: ./scripts/installer-artifact-smoke.ps1
