<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blip-green">
      <stop offset="0%" stop-color="#7EE787" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7EE787" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blip-blue">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer hex -->
  <path d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z"
        fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>

  <!-- Radar rings -->
  <circle cx="50" cy="50" r="12" stroke="#58A6FF" stroke-width="0.8" fill="none" opacity="0.35"/>
  <circle cx="50" cy="50" r="22" stroke="#58A6FF" stroke-width="0.8" fill="none" opacity="0.2"/>
  <circle cx="50" cy="50" r="32" stroke="#58A6FF" stroke-width="0.8" fill="none" opacity="0.1"/>

  <!-- Crosshairs -->
  <line x1="50" y1="16" x2="50" y2="84" stroke="#58A6FF" stroke-width="0.5" opacity="0.12"/>
  <line x1="16" y1="50" x2="84" y2="50" stroke="#58A6FF" stroke-width="0.5" opacity="0.12"/>

  <!-- Sweep wedge -->
  <path d="M50,50 L72,28 A32,32 0 0,0 50,18 Z" fill="url(#sweep)"/>

  <!-- Center -->
  <circle cx="50" cy="50" r="4" fill="#58A6FF"/>
  <circle cx="50" cy="50" r="1.8" fill="#0D1117"/>

  <!-- Blips with glow -->
  <circle cx="30" cy="32" r="6" fill="url(#blip-green)"/>
  <circle cx="30" cy="32" r="2.2" fill="#7EE787"/>
  <circle cx="28" cy="68" r="6" fill="url(#blip-green)"/>
  <circle cx="28" cy="68" r="2.2" fill="#7EE787"/>
  <circle cx="70" cy="35" r="6" fill="url(#blip-blue)"/>
  <circle cx="70" cy="35" r="2.2" fill="#58A6FF"/>
  <circle cx="72" cy="65" r="5" fill="url(#blip-blue)"/>
  <circle cx="72" cy="65" r="1.8" fill="#58A6FF"/>

  <!-- Data traces -->
  <line x1="30" y1="32" x2="48" y2="48" stroke="#7EE787" stroke-width="0.8" opacity="0.4"/>
  <line x1="28" y1="68" x2="48" y2="52" stroke="#7EE787" stroke-width="0.8" opacity="0.4"/>
  <line x1="52" y1="48" x2="70" y2="35" stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="52" y1="52" x2="72" y2="65" stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
</svg>
