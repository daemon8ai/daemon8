[package]
name = "daemon8-mcp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "MCP tool server for daemon8 AI agent integration"
repository.workspace = true
publish.workspace = true

[dependencies]
daemon8-core.workspace = true
daemon8-types.workspace = true
daemon8-store.workspace = true
daemon8-chrome.workspace = true
daemon8-ingest.workspace = true
daemon8-providers.workspace = true
rmcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs.workspace = true

[features]
# Surface test-only helpers (e.g. `DaemonMcp::set_subscription`) for
# integration tests that cannot use `#[cfg(test)]` items from this crate.
# Not enabled in release builds.
test-util = []

[dev-dependencies]
daemon8-mcp = { path = ".", features = ["test-util"] }
rmcp = { workspace = true, features = ["client"] }
tempfile = "3"
async-trait.workspace = true
