[package]
name = "daemon8"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "daemon8"
path = "src/main.rs"

[dependencies]
daemon8-types.workspace = true
daemon8-store.workspace = true
daemon8-ingest.workspace = true
daemon8-chrome.workspace = true
daemon8-adb.workspace = true
daemon8-mcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true
figment.workspace = true
directories.workspace = true
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp.workspace = true
daemon8-api.workspace = true
daemon8-embed = { workspace = true, features = ["fastembed", "ollama", "openai"] }
daemon8-parse.workspace = true
reqwest.workspace = true
reqwest-eventsource.workspace = true
tokio-stream.workspace = true
clap_complete.workspace = true
owo-colors.workspace = true
comfy-table.workspace = true
toml.workspace = true
ureq.workspace = true
cliclack.workspace = true
dirs.workspace = true
notify.workspace = true
glob.workspace = true
libc = "0.2"
xcap = { version = "0.9", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
default = []
xcap = ["dep:xcap", "dep:image"]

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
rmcp = { version = "1.2", features = ["client", "transport-io"] }
futures.workspace = true
proptest = "1"
