[workspace]
members = [
    "crates/types",
    "crates/store",
    "crates/ingest",
    "crates/api",
    "crates/chrome",
    "crates/adb",
    "crates/mcp",
    "crates/parse",
    "crates/providers",
    "crates/core",
    "crates/daemon",
    "tools/vda-probe",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
license-file = "LICENSE"
description = "Runtime observation for AI coding agents"
repository = "https://github.com/daemon8ai/daemon8"
homepage = "https://daemon8.ai"
documentation = "https://daemon8.ai/docs"
keywords = ["observability", "debugging", "ai-agents", "mcp"]
categories = ["development-tools::debugging", "command-line-utilities"]
publish = false

[workspace.dependencies]
# Internal crates
daemon8-types = { version = "0.4.1", path = "crates/types" }
daemon8-store = { version = "0.4.1", path = "crates/store" }
daemon8-ingest = { version = "0.4.1", path = "crates/ingest" }
daemon8-chrome = { version = "0.4.1", path = "crates/chrome" }
daemon8-mcp = { version = "0.4.1", path = "crates/mcp" }
daemon8-adb = { version = "0.4.1", path = "crates/adb" }
daemon8-api = { version = "0.4.1", path = "crates/api" }
daemon8-parse = { version = "0.4.1", path = "crates/parse" }
daemon8-providers = { version = "0.4.1", path = "crates/providers" }
daemon8-core = { version = "0.4.1", path = "crates/core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
humantime = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP
rmcp = { version = "1.2", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }

# Chrome DevTools Protocol (raw WebSocket)
tokio-tungstenite = { version = "0.29", features = ["connect"] }
base64 = "0.22"

# Storage
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "kv-mem"] }

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
directories = "6"
clap = { version = "4", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream"] }
reqwest-eventsource = "0.6"

# Streaming
tokio-stream = { version = "0.1", features = ["sync"] }

# CLI extras
clap_complete = "4"

# Terminal output
owo-colors = "4"
comfy-table = "7"
toml = "0.8"
dirs = "6"

# Async traits
async-trait = "0.1"

# Regex
regex = "1"

# Log parsing
dateparser = "0.3"
syslog_loose = "0.23"
grok = "2"

# Hashing (error fingerprints)
sha2 = "0.10"

# Concurrent cache (observation dedupe)
quick_cache = "0.6"

# Utilities
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
