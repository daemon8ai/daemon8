[workspace]
members = [
    "crates/types",
    "crates/store",
    "crates/ingest",
    "crates/api",
    "crates/chrome",
    "crates/adb",
    "crates/mcp",
    "crates/daemon",
    "tools/vda-probe",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "The admin layer for AI agents"
repository = "https://github.com/daemon8ai/daemon8"
homepage = "https://daemon8.ai"
documentation = "https://daemon8.ai/docs"
keywords = ["observability", "debugging", "ai-agents", "mcp"]
categories = ["development-tools::debugging", "command-line-utilities"]

[workspace.dependencies]
# Internal crates
daemon8-types = { path = "crates/types" }
daemon8-store = { path = "crates/store" }
daemon8-ingest = { path = "crates/ingest" }
daemon8-chrome = { path = "crates/chrome" }
daemon8-mcp = { path = "crates/mcp" }
daemon8-adb = { path = "crates/adb" }
daemon8-api = { path = "crates/api" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP
rmcp = { version = "1.2", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }

# Chrome DevTools Protocol (raw WebSocket)
tokio-tungstenite = { version = "0.29", features = ["connect"] }
base64 = "0.22"

# Storage
rusqlite = { version = "0.39", features = ["bundled", "serde_json"] }
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "kv-mem"] }

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
directories = "6"
clap = { version = "4", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream"] }
ureq = { version = "3", features = ["json"] }
reqwest-eventsource = "0.6"

# Streaming
tokio-stream = { version = "0.1", features = ["sync"] }

# CLI extras
clap_complete = "4"

# Terminal output
owo-colors = "4"
comfy-table = "7"
toml = "0.8"
cliclack = "0.3"
dirs = "6"

# Async traits
async-trait = "0.1"

# Utilities
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
